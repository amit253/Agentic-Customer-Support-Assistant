[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-customer-support"
version = "0.1.0"
description = "Explainable agentic customer support assistant foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "groq>=0.20,<1",
    "numpy>=2.0,<3",
    "python-dotenv>=1,<2",
    "sentence-transformers>=5,<6",
    "silero-vad[onnx-cpu]==6.2.3",
    "webrtcvad-wheels>=2.0.14,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "live: calls a live external provider; skipped by default in the foundation suite",
]
